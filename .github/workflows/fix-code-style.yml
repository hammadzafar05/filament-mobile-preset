name: fix-code-style

on:
  push:
    paths:
      - '**.php'

permissions:
  contents: write

jobs:
  fix-code-style:
    runs-on: ubuntu-latest
    steps:
      # No persisted credentials: this job holds contents:write and then runs
      # `composer install`, i.e. third-party code from Packagist. A write-capable token
      # left in .git/config would be readable by any of it. The push below authenticates
      # explicitly instead, so the token never touches disk.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-cs-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-cs-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --no-interaction --no-scripts

      - name: Run Pint
        run: ./vendor/bin/pint

      # Replaces git-auto-commit-action, which needs persisted credentials to push. Keeping
      # the token in env and only ever in the push URL means it is never written to
      # .git/config. Pushes made with GITHUB_TOKEN do not retrigger workflows, so this
      # cannot loop.
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'Already formatted; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Fix styling'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
