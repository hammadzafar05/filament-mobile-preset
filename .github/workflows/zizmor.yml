name: zizmor

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both are required by the SARIF upload: security-events to write code scanning
      # alerts, actions to read the run for result fingerprinting.
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Defaults are what we want: advanced-security uploads SARIF to code scanning, giving
      # stateful triage and letting alerts close once fixed.
      #
      # Do not add `annotations: true`. It is a competing report channel and the action
      # refuses to run unless advanced-security is also set false.
      #
      # Be aware this mode never fails the job on findings, by design. A green run is not
      # evidence of a clean audit; the Security tab is. To block on findings, add a ruleset
      # requiring the code scanning check rather than relying on this job's exit code.
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
